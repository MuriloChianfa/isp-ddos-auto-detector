version: 2
updates:
  # Monitor pip dependencies for security updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    # Only security updates to avoid breaking reproducibility
    versioning-strategy: lockfile-only
